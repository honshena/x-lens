name: Sync sponsors

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sponsors
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Update sponsors
        env:
          AFDIAN_USER_ID: ${{ secrets.AFDIAN_USER_ID }}
          AFDIAN_TOKEN: ${{ secrets.AFDIAN_TOKEN }}
          AFDIAN_BLOCKED_USER_IDS: ${{ secrets.AFDIAN_BLOCKED_USER_IDS }}
        run: node scripts/sync-sponsors.mjs
      - name: Commit updated list
        run: |
          if git diff --quiet -- sponsors/leaderboard.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sponsors/leaderboard.json
          git commit -m 'Update sponsors'
          git push
